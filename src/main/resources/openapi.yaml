openapi: 3.0.3
info:
  title: OTP WhatsApp Auth API
  description: Contract-first authentication API using WhatsApp OTP
  version: 1.0.0

servers:
  - url: /api/v1

tags:
  - name: Auth
    description: Authentication endpoints
  - name: User
    description: User profile endpoints

paths:
  /auth/request-otp:
    post:
      tags:
        - Auth
      operationId: requestOtp
      summary: Register/login - sends OTP to user's WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-otp:
    post:
      tags:
        - Auth
      operationId: verifyOtp
      summary: Verify OTP and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP verified, JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: OTP mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/name:
    put:
      tags:
        - User
      operationId: updateName
      summary: Set or update the user's name (required on first login)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNameRequest'
      responses:
        '200':
          description: Name updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    OtpRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          example: "+201234567890"
          description: Phone number in international format

    OtpVerifyRequest:
      type: object
      required:
        - phone
        - otp
      properties:
        phone:
          type: string
          example: "+201234567890"
          description: Phone number used during OTP request
        otp:
          type: string
          example: "123456"
          description: 6-digit OTP received on WhatsApp

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        firstLogin:
          type: boolean
          description: True if this is the user's first login (name not yet set)
        user:
          $ref: '#/components/schemas/UserDto'

    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        phone:
          type: string
        firstLogin:
          type: boolean

    UpdateNameRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: John Doe
          description: The user's full name

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
