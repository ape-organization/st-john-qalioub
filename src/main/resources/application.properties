spring.application.name=qalioub

# SQL Server Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA Configuration for SQL Server
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# JWT
app.jwt.secret=ThisIsAVeryLongSecretKeyForJWTSigningThatIsAtLeast256BitsLong1234567890
app.jwt.expiration-ms=86400000

# WhatsApp Business API (Meta Cloud API) - replace with your actual values
app.whatsapp.access-token=WHATSAPP_ACCESS_TOKEN_PLACEHOLDER
app.whatsapp.phone-number-id=WHATSAPP_PHONE_NUMBER_ID_PLACEHOLDER
app.whatsapp.api-url=https://graph.facebook.com/v19.0

# OTP settings
app.otp.expiration-minutes=5
app.otp.length=6

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
