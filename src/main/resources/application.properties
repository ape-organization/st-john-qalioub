spring.application.name=qalioub

# SQL Server Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration for SQL Server
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# JWT
app.jwt.secret=ThisIsAVeryLongSecretKeyForJWTSigningThatIsAtLeast256BitsLong1234567890
app.jwt.expiration-ms=86400000

# WhySMS API
app.sms.api-url=https://bulk.whysms.com/api/v3/sms/send
app.sms.bearer-token=${SMSTOKEN:1234}
app.sms.sender-id=My Order

# OTP settings
app.otp.expiration-minutes=5
app.otp.length=6

# CORS
app.cors.allowed-origins=${ORIGINS:http://localhost:5000}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
