spring.application.name=qalioub

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:qalioubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT
app.jwt.secret=ThisIsAVeryLongSecretKeyForJWTSigningThatIsAtLeast256BitsLong1234567890
app.jwt.expiration-ms=86400000

# WhatsApp Business API (Meta Cloud API) - replace with your actual values
app.whatsapp.access-token=WHATSAPP_ACCESS_TOKEN_PLACEHOLDER
app.whatsapp.phone-number-id=WHATSAPP_PHONE_NUMBER_ID_PLACEHOLDER
app.whatsapp.api-url=https://graph.facebook.com/v19.0

# OTP settings
app.otp.expiration-minutes=5
app.otp.length=6

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
